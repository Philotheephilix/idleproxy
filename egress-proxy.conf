# Tier-1 egress allowlist — SPEC.md §5/§6. Jobs run on the `ipx-jobnet`
# internal Docker network (no route to the internet); this squid forward
# proxy is the only reachable host, and it permits CONNECT to the model API
# host only — nothing else, including DNS-level lookups for other hosts.
#
# Known limitation, disclosed in SPEC.md §12: this allowlist is
# hostname-based (SNI) and the proxy does not terminate TLS, so
# domain-fronting exfiltration is conceivable. Adequate for a disclosed
# demo running our own credentials; production wants a TLS-terminating
# proxy plus gVisor/Firecracker.

http_port 3128

# dstdomain matches the CONNECT method's target host directly (the plain
# hostname the client asked to tunnel to) — no TLS interception/SSL-bump
# needed, which also means this proxy never sees or terminates the job's
# TLS traffic to the API.
acl allowed_connect_dst dstdomain api.anthropic.com
acl CONNECT method CONNECT

http_access allow CONNECT allowed_connect_dst
http_access deny CONNECT

# Plain HTTP (non-CONNECT) requests are never permitted — jobs only ever
# need HTTPS to the API host.
http_access deny all

cache deny all
# Not stdout: the image's unprivileged `proxy` user (cache_effective_user)
# can't open the container's /dev/stdout device node after Squid drops
# root. Logging isn't load-bearing for the allowlist itself, so it's off
# rather than fighting that permission for a demo box.
access_log none
